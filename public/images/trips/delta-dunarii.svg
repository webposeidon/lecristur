<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Cer senin de vară în Deltă -->
  <rect width="800" height="500" fill="#E9F6F6" />

  <!-- Soare luminos la orizont -->
  <circle cx="400" cy="240" r="80" fill="#FFFFFF" />
  <circle cx="400" cy="240" r="58" fill="#C2E6E6" opacity="0.65" />

  <!-- Păsări în zbor (pelicani stilizați) -->
  <path d="M250,130 Q265,115 280,130 Q295,115 310,130" fill="none" stroke="#0E7A7A" stroke-width="3.5" stroke-linecap="round" />
  <path d="M510,110 Q522,97 534,110 Q546,97 558,110" fill="none" stroke="#0E7A7A" stroke-width="3" stroke-linecap="round" />
  <path d="M465,142 Q475,132 485,142 Q495,132 505,142" fill="none" stroke="#008489" stroke-width="2.5" stroke-linecap="round" />

  <!-- Insule de stufăriș la orizont -->
  <path d="M0,295 Q160,265 330,295 T680,285 L800,295 L800,330 L0,330 Z" fill="#A0D4D4" />

  <!-- Ape calme ale Deltei Dunării -->
  <rect x="0" y="310" width="800" height="190" fill="#008489" />
  <path d="M0,375 Q240,355 500,375 T800,365 L800,500 L0,500 Z" fill="#0E7A7A" />
  <path d="M0,430 Q300,410 580,435 T800,425 L800,500 L0,500 Z" fill="#1F284B" />

  <!-- Reflexii albe pe apă -->
  <rect x="355" y="330" width="90" height="6" rx="3" fill="#FFFFFF" opacity="0.75" />
  <rect x="370" y="350" width="60" height="5" rx="2.5" fill="#FFFFFF" opacity="0.6" />
  <rect x="382" y="368" width="36" height="4" rx="2" fill="#FFFFFF" opacity="0.45" />

  <!-- Ambarcațiune de excursie pe canal -->
  <polygon points="295,385 505,385 475,412 325,412" fill="#FFFFFF" />
  <rect x="355" y="366" width="85" height="19" rx="4" fill="#E2F2F2" />
  <polygon points="345,385 455,385 445,392 355,392" fill="#1F284B" />

  <!-- Trestii / Stuf în stânga și dreapta -->
  <line x1="95" y1="480" x2="112" y2="225" stroke="#1F284B" stroke-width="4" stroke-linecap="round" />
  <rect x="106" y="210" width="8" height="32" rx="4" fill="#1F284B" />
  <line x1="125" y1="480" x2="138" y2="250" stroke="#1F284B" stroke-width="3.5" stroke-linecap="round" />
  <rect x="133" y="238" width="7" height="26" rx="3.5" fill="#1F284B" />

  <line x1="695" y1="480" x2="680" y2="235" stroke="#1F284B" stroke-width="4" stroke-linecap="round" />
  <rect x="675" y="220" width="8" height="32" rx="4" fill="#1F284B" />
  <line x1="665" y1="480" x2="655" y2="260" stroke="#1F284B" stroke-width="3.5" stroke-linecap="round" />
</svg>
