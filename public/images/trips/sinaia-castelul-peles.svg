  <rect x="477" y="165" width="48" height="200" fill="#F7F7F7" />
  <polygon points="468,165 501,108 534,165" fill="#008489" />

  <!-- Ferestre -->
  <rect x="292" y="195" width="14" height="26" rx="7" fill="#1F284B" />
  <rect x="494" y="195" width="14" height="26" rx="7" fill="#1F284B" />
  <rect x="392" y="185" width="16" height="32" rx="8" fill="#1F284B" />
  <rect x="340" y="250" width="16" height="26" rx="3" fill="#008489" />
  <rect x="444" y="250" width="16" height="26" rx="3" fill="#008489" />

