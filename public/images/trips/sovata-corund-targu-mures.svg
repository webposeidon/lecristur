<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Fundal luminos de zi -->
  <rect width="800" height="500" fill="#EBF6F6" />

  <!-- Soare și nori -->
  <circle cx="635" cy="112" r="50" fill="#FFFFFF" opacity="0.9" />
  <rect x="140" y="78" width="115" height="22" rx="11" fill="#FFFFFF" opacity="0.85" />

  <!-- Dealurile împădurite ale Sovatei -->
