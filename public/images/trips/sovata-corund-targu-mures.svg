  <path d="M0,345 Q260,262 520,322 T800,292 L800,390 L0,390 Z" fill="#A5D6D6" />

  <!-- Vilă balneară cochetă pe malul Lacului Ursu -->
  <rect x="325" y="235" width="150" height="80" rx="4" fill="#FFFFFF" />
  <polygon points="310,238 400,185 490,238" fill="#0E7A7A" />
  <rect x="382" y="195" width="36" height="45" fill="#F7F7F7" />
  <polygon points="376,195 400,162 424,195" fill="#1F284B" />
  <rect x="350" y="255" width="18" height="26" rx="3" fill="#008489" />
  <rect x="391" y="255" width="18" height="26" rx="3" fill="#008489" />
  <rect x="432" y="255" width="18" height="26" rx="3" fill="#008489" />

  <!-- Brazi pe mal -->
