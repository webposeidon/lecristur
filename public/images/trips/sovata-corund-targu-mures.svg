  <polygon points="270,265 252,322 288,322" fill="#0E7A7A" />
  <polygon points="545,248 522,318 568,318" fill="#008489" />
  <polygon points="580,265 562,322 598,322" fill="#0E7A7A" />

  <!-- Lacul Ursu din Sovata -->
  <rect x="0" y="315" width="800" height="185" fill="#008489" />
  <path d="M0,375 Q240,350 510,378 T800,362 L800,500 L0,500 Z" fill="#0E7A7A" />
  <path d="M0,425 Q330,400 620,428 T800,415 L800,500 L0,500 Z" fill="#1F284B" />

  <!-- Ponton de lemn și reflexii pe apă -->
  <rect x="355" y="315" width="90" height="8" rx="4" fill="#FFFFFF" />
  <rect x="368" y="338" width="64" height="5" rx="2.5" fill="#FFFFFF" opacity="0.7" />
  <rect x="380" y="355" width="40" height="4" rx="2" fill="#FFFFFF" opacity="0.5" />
