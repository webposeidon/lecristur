<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Cer luminos de litoral -->
  <rect width="800" height="500" fill="#E8F5F5" />

  <!-- Soare de vară -->
  <circle cx="620" cy="125" r="58" fill="#FFFFFF" />
  <circle cx="620" cy="125" r="42" fill="#BBE2E2" opacity="0.65" />

  <!-- Pescăruși -->
  <path d="M220,115 Q232,103 244,115 Q256,103 268,115" fill="none" stroke="#0E7A7A" stroke-width="3" stroke-linecap="round" />
  <path d="M290,140 Q300,130 310,140 Q320,130 330,140" fill="none" stroke="#008489" stroke-width="2.5" stroke-linecap="round" />

  <!-- Silueta Cazinoului din Constanța pe faleză -->
  <rect x="150" y="250" width="210" height="55" fill="#CCE7E7" />
  <rect x="175" y="205" width="160" height="50" rx="4" fill="#FFFFFF" />
  <path d="M220,250 C220,212 290,212 290,250 Z" fill="#008489" />
  <path d="M232,250 C232,224 278,224 278,250 Z" fill="#FFFFFF" />
  <!-- Farul la capătul digului -->
  <rect x="445" y="215" width="18" height="65" fill="#FFFFFF" />
  <polygon points="442,215 454,195 466,215" fill="#0E7A7A" />
  <rect x="350" y="275" width="130" height="14" fill="#1F284B" />

  <!-- Marea Neagră în nuanțe Teal curate -->
  <rect x="0" y="288" width="800" height="212" fill="#008489" />
  <path d="M0,345 Q200,325 400,345 T800,335 L800,500 L0,500 Z" fill="#0E7A7A" />

  <!-- Valuri spumoase albe -->
  <path d="M80,322 Q150,314 220,322 T360,322" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  <path d="M480,358 Q560,348 640,358 T760,358" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.8" />

  <!-- Plajă luminoasă în prim-plan -->
  <path d="M0,405 Q320,375 800,425 L800,500 L0,500 Z" fill="#F7F7F7" />
  <path d="M0,435 Q360,405 800,445 L800,500 L0,500 Z" fill="#1F284B" />

  <!-- Barca cu pânze pe mare -->
  <polygon points="565,280 595,215 618,280" fill="#FFFFFF" />
  <polygon points="555,284 625,284 612,298 568,298" fill="#1F284B" />
</svg>
